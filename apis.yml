aid: acadepowder
name: Acade Powder
description: Acade Powder is the English trading name of Suzhou Luxin New Material Technology Co., Ltd. (苏州鲁信新材料科技有限公司),
  a Chinese advanced-materials manufacturer founded in 2013 and headquartered at No. 512 Fangqiao Road, Xiangcheng
  District, Suzhou, Jiangsu, with metal-powder production bases in Henan, Anhui and Jiangsu. It develops, produces
  and sells metal powders for additive manufacturing (3D printing), powder metallurgy, metal injection moulding
  and laser cladding — superalloy, titanium, aluminium, copper, cobalt-chrome, mould steel, high-speed steel and
  soft-magnetic grades, plus custom powders — for aerospace, new energy, electronics, photovoltaic, shipbuilding
  and medical/dental customers. A private pre-IPO company traded on the EquityZen secondary marketplace, it is a
  materials manufacturer rather than a software vendor and publishes no developer program, API documentation, SDK
  or machine-readable API contract.
